<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-gray-900 via-gray-800 to-black min-h-screen flex items-center justify-center">
  <div class="text-center p-8 bg-gray-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-700">
    
    <!-- Title Animation -->
    <h1 class="text-6xl font-extrabold text-pink-200 drop-shadow-lg animate-bounce">
      {{ title }}
    </h1>

    <!-- Subtext -->
    <p class="mt-6 text-2xl text-gray-200 font-light animate-fadeIn">
      Hello, my name is <b class="font-bold text-yellow-300">{{ my_name }}</b>,  
      and I am <span class="italic">{{ my_age }}</span> years old.
    </p>

    <!-- Image with neon glow hover -->
    <div class="mt-10">
      <img src="{{ image }}" alt="My Image"
           class="mx-auto w-64 rounded-xl shadow-2xl border-4 border-pink-400/50
                  transform transition duration-500 hover:scale-110 hover:rotate-3 hover:shadow-pink-500/80">
    </div>

    <!-- Back Home Button -->
    <div class="mt-12">
      <a href="http://localhost:8002/app/doctype?module=Desk"
         class="relative inline-block px-8 py-4 font-bold text-lg text-black rounded-full 
                bg-gradient-to-r from-yellow-400 via-pink-400 to-purple-500 shadow-lg
                transition transform hover:-translate-y-1 hover:scale-105 hover:shadow-yellow-400/50">
        <span class="absolute inset-0 rounded-full bg-white opacity-20 blur-lg animate-pulse"></span>
        ⬅ Back to Home
      </a>
    </div>

  </div>

  <!-- Extra Animations -->
  <style>
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 2s ease-in-out forwards;
    }
  </style>
</body>
</html>
